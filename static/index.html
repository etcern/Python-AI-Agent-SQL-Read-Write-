<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryMaster</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">

    <!-- -- Google Fonts: all offered families preloaded -- -->
    <!-- Ref: https://fonts.google.com/ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;700&family=Nunito:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&family=Source+Sans+3:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- -- Material Symbols Rounded for icons -- -->
    <!-- Ref: https://fonts.google.com/icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- -- highlight.js for code blocks in assistant messages -- -->
    <!-- Ref: https://highlightjs.org/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>

    <!-- -- marked.js for markdown rendering -- -->
    <!-- Ref: https://marked.js.org/ -->
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js"></script>

    <!-- -- DOMPurify to sanitize rendered HTML -- -->
    <!-- Ref: https://github.com/cure53/DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- --- App shell: sidebar + main --- -->
<div id="app">

    <!-- --- Sidebar --- -->
    <aside id="sidebar">
        <div class="sidebar-top">
            <!-- -- Logo -- -->
            <div class="logo-row">
                <div class="logo-icon">CS</div>
                <div class="logo-text">Coding<span class="accent">Stars</span></div>
                <button id="btn-sidebar-close" class="icon-btn" title="Close sidebar">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <!-- -- New Chat -- -->
            <button id="btn-new-chat" class="btn-new-chat">
                <span class="material-symbols-rounded">add</span>
                New Chat
            </button>

            <hr class="sidebar-divider">

            <!-- -- Chat list -- -->
            <div id="chat-list"></div>
        </div>

        <!-- -- Bottom actions: rename + delete -- -->
        <div id="sidebar-actions" class="sidebar-actions"></div>
    </aside>

    <!-- --- Main area --- -->
    <main id="main">

        <!-- -- Hamburger to reopen sidebar -- -->
        <button id="btn-sidebar-open" class="icon-btn hamburger" title="Open sidebar">
            <span class="material-symbols-rounded">menu</span>
        </button>

        <!-- -- Welcome screen (empty chat) -- -->
        <div id="welcome" class="welcome">
            <h2>What can I help you with?</h2>
            <p>Type a message below to get started.</p>
        </div>

        <!-- -- Messages (scrollable) -- -->
        <div id="messages"></div>

        <!-- -- Composer bar (bottom of main) -- -->
        <div id="composer">
            <div id="composer-inner">
                <textarea id="input" placeholder="Message QueryMaster..." rows="1"></textarea>
                <div id="composer-buttons">
                    <button id="btn-agent" class="pill-btn" title="Switch agent">
                        <span class="material-symbols-rounded">smart_toy</span>
                        <span id="agent-label">SQL Assistant</span>
                        <span class="material-symbols-rounded arrow">expand_more</span>
                    </button>
                    <button id="btn-settings" class="icon-btn" title="Settings">
                        <span class="material-symbols-rounded">settings</span>
                    </button>
                    <button id="btn-send" class="send-btn" title="Send message">
                        <span class="material-symbols-rounded">arrow_upward</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- --- Agent picker dropdown --- -->
<div id="agent-dropdown" class="dropdown hidden">
    <div class="dropdown-header">Assistant</div>
    <div id="agent-list"></div>
    <hr class="dropdown-divider">
    <div class="dropdown-header">Model</div>
    <select id="model-select"></select>
</div>

<!-- --- Settings dropdown --- -->
<div id="settings-dropdown" class="dropdown hidden">
    <div class="dropdown-header">Theme</div>
    <select id="theme-select">
        <option value="codingstars-dark">CodingStars Dark</option>
        <option value="vscode-dark">VS Code Dark</option>
        <option value="midnight">Midnight</option>
    </select>

    <div class="dropdown-header">Font</div>
    <select id="font-select">
        <option value="Roboto">Roboto</option>
        <option value="Inter">Inter</option>
        <option value="Source Sans 3">Source Sans 3</option>
        <option value="Nunito">Nunito</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
    </select>

    <div class="dropdown-header">Context window</div>
    <select id="ctx-select">
        <option value="2048">2 048 tokens</option>
        <option value="4096">4 096 tokens</option>
        <option value="8192" selected>8 192 tokens</option>
        <option value="16384">16 384 tokens</option>
        <option value="32768">32 768 tokens</option>
    </select>

    <hr class="dropdown-divider">
    <div class="dropdown-header">Showcase</div>
    <div id="showcase-info"></div>
</div>

<!-- --- Rename modal (inline in sidebar, built by JS) --- -->

<script src="/static/app.js"></script>
</body>
</html>
